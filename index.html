<meta name="apple-mobile-web-app-capable" content="yes">

<style>
  :root {
    --paper: #FBF7EE;
    --card: #FFFFFF;
    --cream: #F3E7D5;
    --ink: #2C2118;
    --soft: #6E5F4E;
    --faint: #C9BCA3;
    --line: #EDE2CC;
    --accent: #8E2F42;
    --accent-soft: #F3E7D5;
    --pink: #C08A2F;
    --blush: #EDE2CC;
    --peony: #6E1F2E;
    --leaf: #7E9A62;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--paper); }
  body {
    margin: 0; padding: 0; color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px; line-height: 1.55;
  }
  .wrap { max-width: 520px; margin: 0 auto; padding: 0 20px 60px; }
  .serif { font-family: Georgia, "Times New Roman", serif; font-weight: 400; }

  .brandbar { padding: 22px 0 0; text-align: center; }
  .wordmark { font-family: Georgia, serif; font-size: 12px; letter-spacing: 5px; text-transform: uppercase; }
  .wordmark .mk { display: block; color: var(--accent); font-size: 13px; letter-spacing: 0; margin-bottom: 5px; }
  .add-home { text-align: center; margin-top: 10px; font-size: 12.5px; color: var(--accent); font-weight: 600; cursor: pointer; }
  .rule-thin { height: 1px; background: var(--line); margin: 16px 0 0; }

  .quote { position: relative; margin-top: 20px; padding: 32px 24px 24px; border-radius: 24px; background: var(--cream); overflow: hidden; text-align: center; }
  .quote .speck { position: absolute; inset: 0; }
  .quote .inner { position: relative; }
  .quote .mk { font-family: Georgia, serif; font-size: 42px; line-height: 0; color: var(--accent); opacity: .45; }
  .quote p { font-family: Georgia, serif; font-size: 21px; line-height: 1.45; margin: 22px 0 0; }
  .quote .by { margin-top: 18px; font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: var(--soft); }

  .hero { position: relative; margin-top: 18px; border-radius: 26px; overflow: hidden; aspect-ratio: 4 / 5; background: var(--cream); }
  .hero-img { position: absolute; inset: 0; background-size: cover; background-position: center; }
  .hero-tag { position: absolute; left: 16px; bottom: 16px; background: rgba(255,255,255,0.88); padding: 9px 15px; border-radius: 30px; font-size: 9.5px; letter-spacing: 2.4px; text-transform: uppercase; color: var(--soft); }

  .greet { padding: 22px 2px 0; }
  .greet h1 { margin: 0; font-family: Georgia, serif; font-weight: 400; font-size: 32px; line-height: 1.15; }
  .greet h1 em { font-style: italic; color: var(--accent); }
  .greet p { margin: 10px 0 0; font-size: 14px; color: var(--soft); }
  .dayline { margin: 22px 0 0; text-align: center; font-family: Georgia, serif; font-style: italic; font-size: 26px; line-height: 1.28; color: var(--peony); }

  /* ---------- bloom ---------- */
  .bloom-card { margin-top: 22px; background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 20px 18px 18px; display: flex; align-items: center; gap: 18px; }
  .bloom { width: 124px; height: 124px; flex: 0 0 124px; }
  .bloom svg { width: 100%; height: 100%; display: block; }
  .bloom-text b { display: block; font-family: Georgia, serif; font-size: 30px; color: var(--peony); line-height: 1.1; }
  .bloom-text span { display: block; font-size: 12px; color: var(--soft); margin-top: 4px; }
  .bloom-text .streak { margin-top: 12px; font-size: 13px; color: var(--ink); }
  .bloom-text .streak b { display: inline; font-size: 17px; color: var(--accent); }

  section { margin-top: 32px; }
  .sec-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
  .sec-head h2 { margin: 0; font-family: Georgia, serif; font-weight: 400; font-size: 22px; }
  .sec-head span { font-size: 10px; letter-spacing: 1.8px; text-transform: uppercase; color: var(--soft); }
  .gentle { font-size: 12.5px; color: var(--soft); font-style: italic; margin: 4px 0 0; }

  .eyebrow { font-size: 9.5px; letter-spacing: 2.8px; text-transform: uppercase; color: var(--accent); margin: 24px 0 10px; }

  .habit { display: flex; gap: 14px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 15px 14px; margin-bottom: 10px; cursor: pointer; transition: transform .12s ease, background .25s ease, border-color .25s ease; }
  .habit:active { transform: scale(.985); }
  .habit.done { background: var(--cream); border-color: var(--accent-soft); }
  .thumb { width: 58px; height: 58px; flex: 0 0 58px; border-radius: 16px; overflow: hidden; background: var(--cream); }
  .thumb div, .thumb svg { width: 100%; height: 100%; display: block; }
  .h-body { flex: 1; min-width: 0; }
  .h-title { font-size: 15px; margin: 0; line-height: 1.35; }
  .habit.done .h-title { color: var(--soft); }
  .h-hint { font-size: 12.5px; color: var(--soft); margin: 3px 0 0; }
  .h-praise { font-size: 12.5px; color: var(--accent); margin: 3px 0 0; font-style: italic; }
  .check { width: 30px; height: 30px; flex: 0 0 30px; border-radius: 50%; border: 1.5px solid var(--faint); display: flex; align-items: center; justify-content: center; font-size: 14px; color: transparent; transition: all .2s ease; }
  .habit.done .check, .suggestion.done .check, .mine-item.done .check { background: var(--accent); border-color: var(--accent); color: #fff; }

  .self-block { margin-top: 26px; }
  .self-heading { margin: 0 0 16px; font-family: Georgia, serif; font-weight: 400; font-size: 22px; line-height: 1.3; }
  .self-label { font-size: 9.5px; letter-spacing: 2.8px; text-transform: uppercase; color: var(--accent); }
  .suggestion { display: flex; gap: 13px; align-items: flex-start; cursor: pointer; margin-top: 20px; padding: 16px; border-radius: 20px; background: var(--cream); border: 1px solid var(--line); }
  .suggestion.done { border-color: var(--accent-soft); }
  .suggestion .txt { flex: 1; min-width: 0; }
  .suggestion .s-line { margin: 8px 0 0; font-family: Georgia, serif; font-size: 18px; line-height: 1.35; }
  .suggestion.done .s-line { color: var(--soft); }
  .suggestion .hint { margin: 5px 0 0; font-size: 12.5px; color: var(--soft); }
  .suggestion .pr { margin: 5px 0 0; font-size: 12.5px; color: var(--accent); font-style: italic; }

  .writeline input { width: 100%; padding: 8px 2px 12px; border: none; border-bottom: 1px solid var(--line); background: transparent; color: var(--ink); font-family: Georgia, serif; font-size: 17px; outline: none; }
  .writeline input::placeholder { color: var(--faint); font-style: italic; }
  .writeline input:focus { border-bottom-color: var(--accent); }
  .write-actions { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; gap: 12px; }
  .clarify { font-size: 11.5px; color: var(--soft); line-height: 1.5; flex: 1; }
  .btn-add { flex: 0 0 auto; padding: 11px 22px; border-radius: 30px; cursor: pointer; border: 1px solid var(--accent); background: transparent; color: var(--accent); font-family: Georgia, serif; font-size: 14px; }
  .mine-item { display: flex; gap: 12px; align-items: center; background: var(--cream); border-radius: 16px; padding: 13px; margin-bottom: 8px; cursor: pointer; }
  .mine-item .t { flex: 1; font-family: Georgia, serif; font-size: 15.5px; }
  .mine-item.done .t { color: var(--soft); }
  .mine-item .rm { background: none; border: none; color: var(--faint); font-size: 18px; cursor: pointer; padding: 0 6px; }
  .consent { margin: 12px 2px 0; font-size: 10.5px; color: var(--faint); line-height: 1.5; }

  .finish { display: block; width: 100%; margin: 30px 0 0; padding: 17px; border: none; border-radius: 30px; background: var(--accent); color: #fff; font-family: Georgia, serif; font-size: 16px; cursor: pointer; }
  .finish:active { opacity: .85; }
  .finish[disabled] { background: var(--line); color: var(--soft); cursor: default; }

  /* ---------- milestones ---------- */
  .miles { display: flex; gap: 9px; }
  .mile { flex: 1; text-align: center; padding: 15px 8px; border-radius: 18px; border: 1px solid var(--line); background: var(--card); cursor: pointer; }
  .mile.locked { opacity: .45; cursor: default; }
  .mile.ready { border-color: var(--accent); background: var(--cream); }

  .toast { position: fixed; left: 50%; bottom: 40px; transform: translate(-50%, 12px); background: var(--ink); color: var(--paper); padding: 12px 20px; border-radius: 30px; font-size: 13px; opacity: 0; pointer-events: none; transition: all .3s ease; z-index: 50; max-width: 86%; text-align: center; }

  .state { text-align: center; padding: 120px 24px; }

ll it, carry it, send it. Then say nothing about it."}, {"t": "Greet someone whose work makes them invisible", "h": "The driver, the cashier, the cleaner. Eye contact and a proper hello."}, {"t": "Say something generous about someone absent", "h": "Praise a person who is not there to hear it."}, {"t": "Give someone ten undivided minutes", "h": "No screen, no clock, no second task underneath."}, {"t": "Send a photo that will make one person smile", "h": "Something you saw today that reminded you of them."}, {"t": "Tell someone what they are good at", "h": "Be precise. Vague praise sounds like politeness."}, {"t": "Reply to a message you left unanswered", "h": "Begin with \"I owe you a reply,\" not an excuse."}, {"t": "Ask someone how their week actually is", "h": "Then stay for the whole answer."}, {"t": "Let someone go ahead of you", "h": "The queue, the door, the lift, the conversation."}, {"t": "Write a review for a small business you like", "h": "Name the person who served you if you can."}, {"t": "Check on someone who has gone quiet", "h": "Silence is usually not indifference."}, {"t": "Offer help before being asked twice", "h": "\"Can I take that?\" before they lift it."}, {"t": "Praise someone where it will be repeated", "h": "To their manager, their partner, their mother. Praise travels."}, {"t": "Remember one detail and mention it", "h": "Their trip, their exam, their appointment."}, {"t": "Give away something you no longer need", "h": "To a person who will actually use it."}, {"t": "Tip more than you meant to", "h": "Quietly, without comment."}, {"t": "Message someone you were once close to", "h": "No agenda. Just a thought of them."}, {"t": "Say thank you to someone at home", "h": "The people closest are thanked least."}, {"t": "Compliment a stranger's effort", "h": "The pressed uniform, the arranged shop, the coffee poured well."}, {"t": "Forgive one small thing today", "h": "Let it go without keeping the receipt."}, {"t": "Introduce two people who should know each other", "h": "Give each of them a reason to be interested."}, {"t": "Answer a repeated question with patience", "h": "Especially one you have answered before."}, {"t": "Congratulate someone properly", "h": "Not an emoji. A sentence about what it took them."}, {"t": "Ask about someone's family by name", "h": "Names turn an ordinary question into a personal one."}, {"t": "Carry something for someone", "h": "A bag, a box, a chair, a door."}, {"t": "Be the first to say hello", "h": "Do not wait to be recognised."}, {"t": "Give a small gift with no occasion", "h": "Occasions are expected. Ordinary days are not."}, {"t": "Say \"I was wrong\" to someone", "h": "Cleanly, without adding \"but.\""}, {"t": "Tell a service worker they did well", "h": "Then tell whoever is standing beside them."}, {"t": "Give someone your seat or your turn", "h": "Before they ask, and without a speech."}, {"t": "Write one message of encouragement", "h": "To someone in the middle of something hard."}, {"t": "Let someone else be right today", "h": "Even when it costs you the last word."}, {"t": "Bring or make something for another person", "h": "Small is fine. Effort is the message."}, {"t": "Send the book, article or song they would love", "h": "With one line about why it made you think of them."}, {"t": "Notice a change and say something kind", "h": "A haircut, a new effort, a room rearranged."}, {"t": "Ask someone what they need, then do it", "h": "Not what you assume they need."}, {"t": "Include the person standing slightly outside", "h": "In the conversation, the plan, the message."}, {"t": "Say good morning at home before anything else", "h": "Before the news, the list, the complaint."}, {"t": "Make one apology you have been postponing", "h": "No conditions attached to it."}, {"t": "Buy something small from someone who needs the sale", "h": "The stall, the new shop, the quiet corner."}, {"t": "Thank someone who taught you something years ago", "h": "Tell them what you still use."} ": "The telling matters more than the news."}, {"t": "Say \"you were right\" when they were", "h": "Out loud, without qualification."}, {"t": "Put your phone away when someone speaks", "h": "Not just silent. Out of the room if you can."}, {"t": "Tell someone why you value them", "h": "Not what they do. Who they are."}, {"t": "Offer your umbrella, coat or arm", "h": "Before the moment passes."}, {"t": "Answer a stranger's question with patience", "h": "Directions, the time, the platform."}, {"t": "Write a thank-you note by hand", "h": "One sentence is enough."}, {"t": "Send money you owe before being reminded", "h": "Being chased is the insult, not the debt."}, {"t": "Ask a quiet person for their opinion", "h": "Then protect the space while they answer."}, {"t": "Defend someone who is not in the room", "h": "Especially when it would be easier not to."}, {"t": "Compliment a family member honestly", "h": "The people nearest hear it least."}, {"t": "Return what you borrowed, improved", "h": "Cleaned, filled, repaired."}, {"t": "Greet a neighbour properly", "h": "Their name if you know it, your eyes if you do not."}, {"t": "Let a small annoyance pass without comment", "h": "Not everything needs to be said."}, {"t": "Offer to take the photograph", "h": "Then take three, so they have a choice."}, {"t": "Ask permission before sharing someone's news", "h": "It is theirs to announce."}, {"t": "Give the last one to someone else", "h": "The slice, the seat, the spot, the turn."}, {"t": "Notice who has not been asked", "h": "Then fix it quietly."}, {"t": "Keep a promise that would be easy to break", "h": "Especially a small one."}, {"t": "Ask a follow-up question a day later", "h": "\"How did it go?\" is the kindest sentence there is."}, {"t": "Compliment the unpolished things", "h": "A voice, a laugh, handwriting, a way of walking."}, {"t": "Give directions by walking part of the way", "h": "Two minutes of your time saves ten of theirs."}, {"t": "Let someone teach you something", "h": "Even if you already know it."}, {"t": "Say goodbye properly", "h": "Look up, use their name, mean it."}, {"t": "Praise someone in front of the person they want to impress", "h": "Their partner, their parent, their manager."}], "respect": [{"t": "Let one person finish their sentence", "h": "Wait for the full stop, not the pause."}, {"t": "Answer a message you have been avoiding", "h": "A late reply is still far better than silence."}, {"t": "Eat one meal without a screen", "h": "Phone out of sight, not face down."}, {"t": "Ask a question without turning it back to yourself", "h": "Resist your own version of the story. Ask a second question."}, {"t": "Speak of no one unkindly today", "h": "Not in messages, not in company, not as a joke."}, {"t": "Disagree without raising your voice", "h": "Lower the volume, slow the pace: \"I see it differently.\""}, {"t": "Thank someone a second time", "h": "Mention what their help actually changed."}, {"t": "Arrive two minutes early", "h": "Early is calm. On time is rushed."}, {"t": "Reply within the day, even briefly", "h": "\"I have this, will answer properly tonight\" counts."}, {"t": "Keep one confidence completely", "h": "Including from the person you tell everything."}, {"t": "Say \"No\" clearly instead of disappearing", "h": "A clean \"No\" is kinder than a slow \"Maybe\"."}, {"t": "Read the whole message before replying", "h": "Most misunderstandings live in the second paragraph."}, {"t": "Let three seconds pass before you answer", "h": "The pause makes the answer sound considered."}, {"t": "Use please with someone paid to serve you", "h": "Payment does not purchase their dignity."}, {"t": "Apologise for lateness without excuses", "h": "\"I am sorry I kept you\" and nothing after it."}, {"t": "Ask before giving advice", "h": "\"Do you want thoughts, or just to talk?\""}, {"t": "Knock before entering any room", "h": "Including at home. Including your own family."}, {"t": "Do not interrupt, even to agree", "h": "Agreement is still an interruption."}, {"t": "Give one call your whole attention", "h": "No typing, no walking, no second screen."}, {"t": "Honour the time you promised", "h": "Ending on time is as courteous as starting on time."}, {"t": "Ask how someone prefers to be addressed", "h": "Then use it exactly that way."}, {"t": "Finish what you agreed to finish", "h": "Or tell the person before the deadline, not after."}, {"t": "Correct someone privately, never publicly", "h": "Praise in the room, correct in the corridor."}, {"t": "Ask before photographing someone", "h": "Including children, including friends."}, {"t": "Let someone change their mind without comment", "h": "No \"I thought you said.\""}, {"t": "Return a call the same day", "h": "Even to say you cannot talk today."}, {"t": "Say the difficult thing kindly and directly", "h": "Softness in tone, clarity in content."}, {"t": "Do not repeat gossip, even true gossip", "h": "Truth does not make it yours to spread."}, {"t": "Give someone the benefit of the doubt once", "h": "Assume the tired explanation, not the unkind one."}, {"t": "Turn your camera on when others have", "h": "A black square asks others to give what you withhold."}, {"t": "Wait to be offered before helping yourself", "h": "In someone's home, kitchen or office."}, {"t": "Respect a closed door", "h": "A closed door is a complete sentence."}, {"t": "Do not answer for someone who can answer", "h": "Especially a child or a quieter colleague."}, {"t": "Take your disagreement to the person", "h": "Not to everyone else first."}, {"t": "Let someone else choose", "h": "The restaurant, the route, the film."}, {"t": "Pronounce a name correctly", "h": "Ask twice if you need to. It is worth the small embarrassment."}, {"t": "Do not read over anyone's shoulder", "h": "Screens, letters, notebooks."}, {"t": "Give a straight answer to a straight question", "h": "Vagueness is a way of taking someone's time."}, {"t": "Send the thing you promised to send", "h": "The link,  a reward. It is maintenance.", "You kept a promise to yourself today.", "Care, quietly given, to the right person.", "You are allowed this.", "Well looked after.", "The person doing all this deserved that."]}, "completion": [{"title": "A day well kept", "line": "All three, complete. Days like this are what the practice is made of.", "tomorrow": "Tomorrow: begin before you feel ready."}, {"title": "Beautifully done", "line": "Kindness, respect and elegance in a single ordinary day.", "tomorrow": "Tomorrow: one small courtesy, before anything else."}, {"title": "Complete", "line": "Nobody watched you do this, which is exactly why it counts.", "tomorrow": "Tomorrow: keep the standard when nobody is looking."}, {"title": "All three", "line": "You practised being the kind of person people remember well.", "tomorrow": "Tomorrow: slow down by a quarter and see what changes."}, {"title": "A full day", "line": "Small courtesies, repeated, become character.", "tomorrow": "Tomorrow: begin with the person nearest to you."}, {"title": "Finished well", "line": "This is what an ordinary day, done properly, looks like.", "tomorrow": "Tomorrow: say the kind thing before you leave the room."}, {"title": "Every one", "line": "Three habits kept. The streak is not the point, but it is lovely.", "tomorrow": "Tomorrow: notice your posture three times."}, {"title": "Done", "line": "You chose composure, attention and warmth today.", "tomorrow": "Tomorrow: let someone else have the last word."}, {"title": "Complete", "line": "Excellence is a series of ordinary days done well. Today was one.", "tomorrow": "Tomorrow: arrive two minutes early to something."}, {"title": "A quiet triumph", "line": "No audience, no applause, no shortcut. Just the practice.", "tomorrow": "Tomorrow: give one person ten undivided minutes."}, {"title": "All three kept", "line": "You were, today, exactly the person you are training to be.", "tomorrow": "Tomorrow: send the message you have been meaning to send."}, {"ti     if (TELEGRAM_ID && STUDENT_ID) {
      fetch(API + "/api/state", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ student_id: STUDENT_ID, state: STATE }),
      }).catch(function () {});
    }
  }

  /* ---- derived ---- */
  function programDay() { return Math.max(1, daysBetween(STATE.start, todayISO()) + 1); }
  function dayRecord(iso) {
    if (!STATE.days[iso]) STATE.days[iso] = { done: {}, own: [] };
    if (!STATE.days[iso].own) STATE.days[iso].own = [];
    return STATE.days[iso];
  }
  function dayComplete(iso) {
    var r = STATE.days[iso];
    if (!r) return false;
    var dayNum = daysBetween(STATE.start, iso) + 1;
    return !!r.done[categoryForDay(dayNum)];
  }
  function completedCount() {
    var n = 0;
    for (var k in STATE.days) if (dayComplete(k)) n++;
    return n;
  }
  function currentStreak() {
    var iso = todayISO(), n = 0;
    if (!dayComplete(iso)) iso = isoPlus(iso, -1);
    while (dayComplete(iso)) { n++; iso = isoPlus(iso, -1); }
    return n;
  }

  /* ================= helpers ================= */
  var DATA = null, app = document.getElementById("app");
  var showAllClasses = false;

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function greeting() {
    var h = new Date().getHours();
    return h < 12 ? "Good morning," : h < 18 ? "Good afternoon," : "Good evening,";
  }
  function rng(seed) {
    var s = seed >>> 0;
    return function () {
      s += 0x6D2B79F5; var t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function shuffled(n, seed) {
    var a = [], i, j, t, rand = rng(seed);
    for (i = 0; i < n; i++) a.push(i);
    for (i = n - 1; i > 0; i--) { j = Math.floor(rand() * (i + 1)); t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  var SEEDS = { kindness: 10007, respect: 20011, elegance: 30013, self: 60017, quote: 40009, praise: 50021 };
  function seedFor(id) {
    if (SEEDS[id]) return SEEDS[id];
    var s = 70001, i;
    for (i = 0; i < id.length; i++) s = (s * 31 + id.charCodeAt(i)) >>> 0;
    return s;
  }
  function pick(list, dirId, day, cycleLen) {
    if (!list || !list.length) return null;
    var cycle = Math.floor((day - 1) / cycleLen);
    var order = shuffled(list.length, seedFor(dirId) + cycle * 7919);
    return list[order[((day - 1) % cycleLen) % list.length]];
  }
  // \u041e\u0434\u0438\u043d \u043a\u043b\u044e\u0447\u0435\u0432\u043e\u0439 \u043d\u0430\u0432\u044b\u043a \u0432 \u0434\u0435\u043d\u044c (\u0431\u044b\u043b\u043e 4) \u2014 \u043f\u043e \u043a\u0440\u0443\u0433\u0443: Kindness -> Respect -> Elegance.
  var TASK_CATEGORIES = ["kindness", "respect", "elegance"];

  // \u0415\u0436\u0435\u0434\u043d\u0435\u0432\u043d\u043e \u043c\u0435\u043d\u044f\u044e\u0449\u0435\u0435\u0441\u044f \u0444\u043e\u0442\u043e \u043d\u0430 \u043a\u0430\u0440\u0442\u043e\u0447\u043a\u0435 \u0434\u043d\u044f. \u0418\u0440\u0438\u043d\u0430 \u043f\u0440\u0438\u0441\u044b\u043b\u0430\u0435\u0442 \u043d\u043e\u0432\u044b\u0435 \u2014
  // \u043f\u0440\u043e\u0441\u0442\u043e \u0434\u043e\u0431\u0430\u0432\u043b\u044f\u0439 URL \u0432 \u043a\u043e\u043d\u0435\u0446 \u044d\u0442\u043e\u0433\u043e \u0441\u043f\u0438\u0441\u043a\u0430, \u043f\u043e\u0440\u044f\u0434\u043e\u043a \u0440\u043e\u0442\u0430\u0446\u0438\u0438 \u0441\u0430\u043c \u0441\u0434\u0432\u0438\u043d\u0435\u0442\u0441\u044f.
  var HERO_PHOTOS = [
    "https://images.unsplash.com/photo-1610629737680-8a6daf3dadf7?w=1200&q=80",
    "https://images.unsplash.com/photo-1618244965061-1d27b208d6e8?w=1200&q=80",
    "https://images.unsplash.com/photo-1751399566412-ad1194241c5c?w=1200&q=80",
    "https://images.unsplash.com/photo-1704627364363-6a70e2fad981?w=1200&q=80",
    "https://images.unsplash.com/photo-1775701663549-f32e3f168358?w=1200&q=80"
  ];
  function heroForDay(day) {
    if (!HERO_PHOTOS.length) return null;
    return HERO_PHOTOS[(day - 1) % HERO_PHOTOS.length];
  }
  function categoryForDay(day) { return TASK_CATEGORIES[(day - 1) % TASK_CATEGORIES.length]; }
  function todaysSet(day) {
    var pools = DATA.pools || {}, cycleLen = (DATA.program && DATA.program.cycleDays) || 90;
    var catId = categoryForDay(day);
    var dir = (DATA.directions || []).filter(function (d) { return d.id === catId; })[0] || {};
    var item = pick(pools[catId], catId, day, cycleLen);
    var pr = (DATA.praise && DATA.praise[catId]) || ["Beautifully done."];
    var idx = Math.floor(rng(SEEDS.praise + day * 31 + catId.length)() * pr.length);
    var habit = item ? { id: catId, title: item.t, hint: item.h, praise: pr[idx] } : null;

    // "Kindness for Yourself" -- always available, optional, does not affect streak/petals.
    var selfItem = pick(pools["self"], "self", day, cycleLen);
    var selfPr = (DATA.praise && DATA.praise["self"]) || ["Beautifully done."];
    var selfIdx = Math.floor(rng(SEEDS.praise + day * 31 + 4)() * selfPr.length);
    var selfHabit = selfItem ? { id: "self", title: selfItem.t, hint: selfItem.h, praise: selfPr[selfIdx] } : null;

    var qs = DATA.quotes || [], quote = "";
    if (qs.length) {
      var qOrder = shuffled(qs.length, SEEDS.quote + Math.floor((day - 1) / qs.length) * 7919);
      quote = qs[qOrder[(day - 1) % qs.length]];
    }
    return { habit: habit, category: dir, quote: quote, selfHabit: selfHabit };
  }
  function speckles(seed, n, w, h) {
    var r = rng(seed), s = "", i;
    for (i = 0; i < n; i++) {
      s += '<circle cx="' + (r() * w).toFixed(1) + '" cy="' + (r() * h).toFixed(1) + '" r="' + (0.7 + r() * 1.9).toFixed(1) +
           '" fill="#A8123F" fill-opacity="' + (0.08 + r() * 0.18).toFixed(2) + '"/>';
    }
    return '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%">' + s + '</svg>';
  }

  /* ================= the 90-petal bloom ================= */
  function bloomSvg(filled, total) {
    var s = '<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">';
    var rings = [
      { count: 36, rx: 6.5, ry: 34, dist: 44, rot: 0 },
      { count: 30, rx: 6, ry: 26, dist: 32, rot: 6 },
      { count: 24, rx: 5, ry: 18, dist: 21, rot: 3 }
    ];
    var placed = 0, i, ring, k, ang, on, fill, stroke;
    for (k = 0; k < rings.length; k++) {
      ring = rings[k];
      for (i = 0; i < ring.count; i++) {
        ang = ring.rot + i * (360 / ring.count);
        on = placed < filled;
        fill = on ? (k === 0 ? "#8E2F42" : k === 1 ? "#C08A2F" : "#F3E7D5") : "#FFFFFF";
        stroke = on ? "rgba(142,47,66,0.30)" : "#EDE2CC";
        s += '<ellipse cx="100" cy="' + (100 - ring.dist) + '" rx="' + ring.rx + '" ry="' + ring.ry +
             '" fill="' + fill + '" stroke="' + stroke + '" stroke-width="0.8" ' +
             'transform="rotate(' + ang.toFixed(1) + ' 100 100)"/>';
        placed++;
      }
    }
    s += '<circle cx="100" cy="100" r="9" fill="' + (filled >= total ? "#6E1F2E" : "#F3E7D5") + '" stroke="#E3D2B4" stroke-width="1"/>';
    return s + '</svg>';
  }

  /* ================= render ================= */
  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(t._t); t._t = setTimeout(function () { t.classList.remove("show"); }, 2100);
  }
  function closeOverlay() { document.getElementById("overlay").classList.remove("open"); }

  function render() {

    var pr = DATA.program || {}, cyc = pr.cycleDays || 90;
    var day = programDay(), iso = todayISO(), rec = dayRecord(iso);
    var evening = new Date().getHours() >= 18;
    var viewDay = evening ? day + 1 : day;
    var set = todaysSet(viewDay);
    var habit = set.habit;
    var tomorrowRec = evening ? dayRecord(isoPlus(todayISO(), 1)) : null;

    var petals = completedCount(), streak = currentStreak();

    html += '<div class="greet"><h1>' + greeting() + ' <em>' + esc(STATE.name || "there") + '</em></h1>' +

    if (dl.text !== "") html += '<p class="dayline">' + esc(dl.text || "Another Day closer to Elegant New You") + '</p>';

    html += '<div class="bloom-card"><div class="bloom">' + bloomSvg(Math.min(petals, cyc), cyc) + '</div>' +

    if (habit) {

        '<div class="thumb">' + (imgs[habit.id] ? '<div style="background-image:url(\'' + esc(imgs[habit.id]) + '\');background-size:cover;background-position:center"></div>' : '') + '</div>' +
        '<div class="h-body"><p class="h-title">' + esc(habit.title) + '</p>' +

      html += '<div class="suggestion' + (sd ? " done" : "") + '" data-id="self"><div class="txt">' +
                '<div class="self-label">' + esc(cfg.suggestionLabel || "Elegance Academy suggestion") + '</div>' +

                '<div class="check">\u2713</div><div class="t">' + esc(m.text) + '</div>' +

                '<div class="write-actions" style="justify-content:flex-end"><button class="btn-add" id="ownAdd">Add</button></div>';
      }
      html += '</div>';
    }
    html += '</section>';

    /* milestones */
    var miles = DATA.milestones || [];
    if (miles.length) {
      html += '<section><div class="sec-head"><h2>Your rewards</h2></div><div class="miles">';
      miles.forEach(function (m) {
        var ready = petals >= m.day;
        html += '<div class="mile ' + (ready ? "ready" : "locked") + '" data-mile="' + m.day + '">' +
                '<b>' + m.day + '</b><span>' + esc(m.short || m.title) + '</span></div>';

  function bind() {

      var inp = document.getElementById("ownInput");

    }
    Array.prototype.forEach.call(document.querySelectorAll("[data-own]"), function (el) {
      el.addEventListener("click", function (e) {
        if (e.target.hasAttribute("data-remove")) return;
        var r = dayRecord(todayISO()), i = parseInt(el.getAttribute("data-own"), 10);
        r.own[i].done = !r.own[i].done; saveState(); haptic("light"); render();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-remove]"), function (b) {
      b.addEventListener("click", function (e) {
        e.stopPropagation();
        var r = dayRecord(todayISO());

        saveState(); render();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll(".session .book"), function (btn) {

  function togglePromise() {
    var trec = dayRecord(isoPlus(todayISO(), 1));

    saveState();
    haptic(trec.promised ? "medium" : "light");
    render();
    if (trec.promised) toast("Promise made \u2014 see you tomorrow.");
  }

  function toggleHabit(id) {
    if (id === "promise") { togglePromise(); return; }
    var rec = dayRecord(todayISO());
    var day = programDay(), set = todaysSet(day);
    var isMain = !!(set.habit && set.habit.id === id);
    var h = isMain ? set.habit : (id === "self" ? set.selfHabit : null);
    rec.done[id] = !rec.done[id];
    saveState();
    haptic(rec.done[id] ? "medium" : "light");
    render();
    if (rec.done[id] && h) toast(h.praise);

    if (isMain && rec.done[id] && !rec.celebrated) {

      setTimeout(celebrate, 480);

  }

  function addOwn(raw) {

  /* ================= milestones ================= */
  function checkMilestone() {

  function openMilestone(day, isNew) {

    if (!m) return;

    if (petals < m.day) {

    haptic("medium");
    var body = '<div class="mark">\u2726</div><h3>' + esc(m.title) + '</h3>' +

               '<p class="line">' + esc(m.body || "") + '</p>';

    if (m.type === "voice" && !m.audioUrl) body += '<p class="line" style="color:var(--soft);font-style:italic">Your voice message will appear here.</p>';
    if (m.type === "reward" && m.code) body += '<div class="code">' + esc(m.code) + '</div>' +
      '<p class="line" style="font-size:12.5px;color:var(--soft)">' + esc(m.howTo || "") + '</p>';
    body += '<div class="brand">' + esc((DATA.brand && DATA.brand.name) || "Elegance Academy") + '</div><button id="closeCard">Close</button>';
    document.getElementById("daycard").innerHTML = body;
    document.getElementById("overlay").classList.add("open");
    document.getElementById("closeCard").onclick = function () { closeOverlay(); render(); };
  }

  /* ================= booking ================= */
  function askToReserve(id) {
    var c = (DATA.classes.upcoming || []).filter(function (x) { return x.id === id; })[0];
    if (!c || c.reserved) return;
    haptic("light");
    document.getElementById("daycard").innerHTML =
      '<div class="mark">\u2726</div><h3>Reserve your place</h3>' +
      '<p class="line" style="font-family:Georgia,serif;font-size:19px">' + esc(c.title) + '</p>' +
      '<div class="share" style="color:var(--soft);margin-top:8px">' + esc([c.date, c.time].filter(Boolean).join(" \u00b7 ")) + '</div>' +
      '<div class="share" style="color:var(--soft);margin-top:4px">' + esc(c.format || "") + '</div>' +
      '<div class="tomorrow">You will finish booking on our website. Confirmation arrives by email.</div>' +
      '<button class="primary" id="confirmBook">Continue to booking</button><button id="closeCard">Not now</button>';
    document.getElementById("overlay").classList.add("open");
    document.getElementById("closeCard").onclick = closeOverlay;
    document.getElementById("confirmBook").onclick = function () {
      haptic("medium");
      try { if (tg && tg.openLink) tg.openLink(c.bookingUrl); else window.open(c.bookingUrl, "_blank"); } catch (e) {}
      if (!c.onDemand) { c.reserved = true; if (c.spotsLeft > 0) c.spotsLeft--; }
      closeOverlay(); render(); toast("Opening your booking page\u2026");
    };
  }

  /* ================= onboarding ================= */
  function validEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }

  function sendContact(name, email, marketing) {
    if (!TELEGRAM_ID) return;
    var text = "I agree that Elegance Academy may process my name and email to give me access to this practice." + (marketing ? " I would also like occasional emails about classes and offers." : "");
    fetch(API + "/api/contact", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        telegram_id: TELEGRAM_ID,
        full_name: name,
        email: email,
        marketing_consent: marketing,
        consent_text: text,
      }),
    }).then(function () { NEEDS_CONTACT = false; }).catch(function () {});
  }

  function contactGate() {
    var appCfg = DATA.app || {};
    document.getElementById("daycard").innerHTML =
      '<div class="mark">\u2726</div>' +
      '<h3>One small thing</h3>' +
      '<p class="line">So Irina can keep your practice safe and send you your progress, please leave your name and email. Once, and never again.</p>' +
      '<input id="cName" type="text" maxlength="30" autocomplete="given-name" placeholder="First name" value="' + esc(STATE.name || "") + '">' +
      '<input id="cLast" type="text" maxlength="30" autocomplete="family-name" placeholder="Last name">' +
      '<input id="cEmail" type="email" inputmode="email" autocomplete="email" placeholder="Your email">' +
      '<label class="consent"><input type="checkbox" id="cData"><span>I agree that Elegance Academy may process my name and email to give me access to this practice.</span></label>' +
      '<label class="consent"><input type="checkbox" id="cMkt"><span>I would also like occasional emails about classes and offers.</span></label>' +
      '<button class="primary" id="cSave">Continue my practice</button>';
    document.getElementById("overlay").classList.add("open");
    GATE_OPEN = true;
    document.getElementById("cSave").onclick = function () {
      var n = (document.getElementById("cName").value || "").trim();
      var ln = (document.getElementById("cLast").value || "").trim();
      var em = (document.getElementById("cEmail").value || "").trim();
      if (n.length < 2) { toast("Please write your first name."); return; }
      if (ln.length < 2) { toast("Please write your last name."); return; }
      if (!validEmail(em)) { toast("Please check your email."); return; }
      if (!document.getElementById("cData").checked) { toast("Please tick the consent box."); return; }
      sendContact(n + " " + ln, em, document.getElementById("cMkt").checked);
      STATE.name = n; saveState();
      GATE_OPEN = false;
      haptic("medium"); closeOverlay(); render();
    };
  }

  function welcome() {
    var suggested = "";
    try { if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) suggested = tg.initDataUnsafe.user.first_name || ""; } catch (e) {}
    var appCfg = DATA.app || {};
    document.getElementById("daycard").innerHTML =
      '<div class="mark">\u2726</div>' +
      '<h3>' + esc(appCfg.welcomeTitle || appCfg.name || "My Elegance Journey") + '</h3>' +
      '<div class="share">' + esc("by " + (appCfg.by || (DATA.brand && DATA.brand.name) || "Elegance Academy")) + '</div>' +
      '<p class="line">' + esc(appCfg.welcomeLine || "Ninety days of small courtesies. One petal for every day you complete.") + '</p>' +
      '<input id="nameInput" type="text" maxlength="30" autocomplete="given-name" placeholder="First name" value="' + esc(suggested) + '">' +
      '<input id="lastInput" type="text" maxlength="30" autocomplete="family-name" placeholder="Last name">' +
      '<input id="emailInput" type="email" inputmode="email" autocomplete="email" placeholder="Your email">' +
      '<label class="consent"><input type="checkbox" id="dataConsent"><span>I agree that Elegance Academy may process my name and email to give me access to this practice.</span></label>' +
      '<label class="consent"><input type="checkbox" id="mktConsent"><span>I would also like occasional emails about classes and offers.</span></label>' +
      '<button class="primary" id="beginBtn">Begin day one</button>';
    document.getElementById("overlay").classList.add("open");
    GATE_OPEN = true;
    var inp = document.getElementById("nameInput");
    document.getElementById("beginBtn").onclick = function () {
      var n = (inp.value || "").trim();
      var ln = (document.getElementById("lastInput").value || "").trim();
      var em = (document.getElementById("emailInput").value || "").trim();
      if (n.length < 2) { toast("Please write your first name."); return; }
      if (ln.length < 2) { toast("Please write your last name."); return; }
      if (!validEmail(em)) { toast("Please check your email."); return; }
      if (!document.getElementById("dataConsent").checked) { toast("Please tick the consent box."); return; }
      var mkt = document.getElementById("mktConsent").checked;
      STATE.name = n; STATE.start = todayISO(); saveState();
      sendContact(n + " " + ln, em, mkt);
      GATE_OPEN = false;
      haptic("medium"); closeOverlay(); render();
    };
    inp.addEventListener("keydown", function (e) { if (e.key === "Enter") document.getElementById("beginBtn").click(); });
  }

  document.getElementById("overlay").addEventListener("click", function (e) { if (e.target === this && !GATE_OPEN) closeOverlay(); });

  /* ================= boot ================= */
  function showFallback(msg) {
    app.innerHTML = '<div class="state"><div class="mark">\u2726</div><h2 class="serif">We could not load your practice</h2><p>' +
      esc(msg) + '</p><button id="retryBtn">Try again</button></div>';
    document.getElementById("retryBtn").onclick = load;
  }

  function identifyWithServer(localState, cb) {
    if (!TELEGRAM_ID) { cb(null); return; }
    fetch(API + "/api/identify", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        telegram_id: TELEGRAM_ID,
        name: TELEGRAM_FIRST_NAME,
        start: localState ? localState.start : null,
      }),
    })
      .then(function (r) { return r.json(); })
      .then(function (data) { if (data && data.needs_contact) NEEDS_CONTACT = true; cb(data && !data.error ? data : null); })
      .catch(function () { cb(null); });
  }

  function load() {
    app.innerHTML = '<div class="state"><div class="mark">\u2726</div><h2 class="serif">Elegance Academy</h2><p>Preparing your practice\u2026</p></div>';
    Promise.resolve(window.__APP_DATA__)
      .then(function (json) {
        DATA = json;
        loadState(function (saved) {
          var localState = saved && saved.start ? saved : null;
          identifyWithServer(localState, function (server) {
            if (server) {
              STUDENT_ID = server.student_id;
              if (server.state && server.state.start) {
                STATE = server.state;
              } else if (localState) {
                STATE = localState;
                saveState();
              } else {
                STATE = blankState();
              }
            } else {
              STATE = localState || blankState();
            }
            if (!STATE.milestones) STATE.milestones = {};
            if (!STATE.days) STATE.days = {};
            if (!STATE.name) { render(); welcome(); }
            else { render(); if (NEEDS_CONTACT) contactGate(); }
          });
        });
      })
      .catch(function (err) {
        showFallback("We could not reach data.json (" + err.message + "). Check that it sits beside index.html, then try again.");
      });
  }

  load();
})();
</script>
</body>
</html>
